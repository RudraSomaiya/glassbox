[package]
name = "glassbox-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
fancy-regex = "0.14"
half = "2"
rayon = { version = "1", optional = true }
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9"
