<title id="t">Speculative decoding: speedup over the target alone</title>
<rect width="760" height="380" class="bg"/>
<text x="24.0" y="32.0" class="ink" font-size="18" text-anchor="start" font-weight="700">Speculative decoding: speedup over the target alone</text>
<text x="24.0" y="54.0" class="ink2" font-size="13" text-anchor="start" font-weight="400">Greedy, identical output. 1.0 means no gain; below 1 the drafting costs more than it saves.</text>
<rect x="24" y="70" width="12" height="12" rx="2" class="glassbox"/>
<text x="42.0" y="80.0" class="ink" font-size="13" text-anchor="start" font-weight="400">135M -&gt; 360M</text>
