<text x="162.0" y="80.0" class="ink" font-size="13" text-anchor="start" font-weight="400">135M -&gt; 1.7B</text>
<rect x="264.0" y="70" width="12" height="12" rx="2" class="transformers"/>
<text x="282.0" y="80.0" class="ink" font-size="13" text-anchor="start" font-weight="400">1.7B Q4_0 -&gt; 1.7B Q8_0</text>
<rect x="459.0" y="70" width="12" height="12" rx="2" class="mark"/>
<text x="477.0" y="80.0" class="ink" font-size="13" text-anchor="start" font-weight="400">prompt lookup -&gt; 360M (summaries)</text>
