<title id="t">How Glassbox got fast: decode speed at each step</title>
<rect width="760" height="340" class="bg"/>
<text x="24.0" y="32.0" class="ink" font-size="18" text-anchor="start" font-weight="700">How it got fast: decode tokens per second</text>
<text x="24.0" y="54.0" class="ink2" font-size="13" text-anchor="start" font-weight="400">standin-135M, Intel(R) Xeon(R) Processor @ 2.10GHz, commit a3f6389</text>
<text x="188.0" y="102.0" class="ink" font-size="13" text-anchor="end" font-weight="400">scalar, 1 thread</text>
<rect x="200" y="86" width="4.1" height="24" rx="3" class="glassbox"><title>scalar, 1 thread: 8.5 tok/s</title></rect>
<text x="212.1" y="103.0" class="ink" font-size="13" text-anchor="start" font-weight="700">8.5</text>
<text x="188.0" y="146.0" class="ink" font-size="13" text-anchor="end" font-weight="400">AVX2, 1 thread</text>
<rect x="200" y="130" width="10.7" height="24" rx="3" class="glassbox"><title>AVX2, 1 thread: 22.3 tok/s</title></rect>
<text x="218.7" y="147.0" class="ink" font-size="13" text-anchor="start" font-weight="700">22.3</text>
<text x="188.0" y="190.0" class="ink" font-size="13" text-anchor="end" font-weight="400">AVX2, 4 threads</text>
<rect x="200" y="174" width="31.3" height="24" rx="3" class="glassbox"><title>AVX2, 4 threads: 65.1 tok/s</title></rect>
<text x="239.3" y="191.0" class="ink" font-size="13" text-anchor="start" font-weight="700">65.1</text>
<text x="188.0" y="234.0" class="ink" font-size="13" text-anchor="end" font-weight="400">Q8_0 int8 dot</text>
<rect x="200" y="218" width="85.2" height="24" rx="3" class="glassbox"><title>Q8_0 int8 dot: 177.5 tok/s</title></rect>
<text x="293.2" y="235.0" class="ink" font-size="13" text-anchor="start" font-weight="700">177.5</text>
<text x="188.0" y="278.0" class="ink" font-size="13" text-anchor="end" font-weight="400">Q4_0 int8 dot</text>
<rect x="200" y="262" width="101.8" height="24" rx="3" class="glassbox"><title>Q4_0 int8 dot: 212.0 tok/s</title></rect>
